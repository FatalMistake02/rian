name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./...
      - name: Check for races
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  package:
    name: npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test tooling
        run: npm test
      - name: Build all six platforms
        run: npm run build
      - name: Verify package
        run: npm run test:package
      - name: Test packed installation
        run: npm run test:install
