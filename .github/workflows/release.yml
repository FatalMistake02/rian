name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Run one release at a time without cancelling an in-progress publish.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.cjs "$RELEASE_TAG"
      - name: Test Go and release tooling
        run: |
          go test ./...
          go vet ./...
          node --test test/npm/release.test.cjs
      - name: Build all six platforms
        run: npm run build
      - name: Test package
        run: |
          npm test
          npm run test:package
      - name: Pack tested release
        run: |
          mkdir -p dist/npm
          npm pack --pack-destination dist/npm
      - name: Package standalone downloads
        run: npm run package:release
      - name: Test standalone installer
        run: node --test test/npm/install.test.cjs
      - uses: oven-sh/setup-bun@v2
      - name: Test Bun installation
        run: node scripts/check-bun.cjs
      - name: Test packed installation
        run: npm run test:install -- dist/npm/*.tgz
      - name: Publish to npm with trusted publishing
        run: npm publish dist/npm/*.tgz --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/rian_* dist/release/SHA256SUMS dist/release/VERSION dist/release/install.sh --clobber
            gh release edit "$RELEASE_TAG" --notes-file dist/release/notes.md
          else
            gh release create "$RELEASE_TAG" dist/release/rian_* dist/release/SHA256SUMS dist/release/VERSION dist/release/install.sh --verify-tag --notes-file dist/release/notes.md --title "Rian $RELEASE_TAG"
          fi
      - name: Update Homebrew formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          tap_dir=$(mktemp -d)
          git worktree add --detach "$tap_dir" origin/main
          mkdir -p "$tap_dir/Formula"
          cp dist/release/rian.rb "$tap_dir/Formula/rian.rb"
          cd "$tap_dir"
          git add Formula/rian.rb
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update Homebrew formula for $RELEASE_TAG"
            git push origin HEAD:refs/heads/main
          fi
